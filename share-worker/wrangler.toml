name = "sourcecapsule-share"
main = "worker.mjs"
compatibility_date = "2026-07-01"

[[r2_buckets]]
binding = "CAPSULES"
bucket_name = "sourcecapsule-shares"
preview_bucket_name = "sourcecapsule-shares-dev"

[triggers]
crons = ["17 3 * * *"]

# Per-IP limit on creating new share links (POST /api/capsules).
# IPv6 clients are keyed on their /64 prefix.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Per-capsule limit on file uploads (PUT /api/capsules/<id>/files/...), keyed on the
# capsule id after the bearer token checks out. One capsule legitimately uploads ~40 files
# in a burst, so the limit leaves headroom for retries.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
